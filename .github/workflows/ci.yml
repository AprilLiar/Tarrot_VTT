name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: '1'

  readme-updated:
    # The README is the living design document: a PR that changes code must
    # change README.md in the same PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require README.md update when code changes
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          code=$(echo "$changed" | grep -E '^(server/|client/src/|client/index\.html|e2e/|render\.yaml|package\.json|\.github/workflows/)' || true)
          if [ -n "$code" ] && ! echo "$changed" | grep -qx 'README.md'; then
            echo "Code changed but README.md (the living design doc) was not updated:"
            echo "$code"
            exit 1
          fi
