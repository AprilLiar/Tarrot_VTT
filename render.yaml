services:
  - type: web
    name: tarrot-vtt
    runtime: node
    plan: free
    # Deploy by itself whenever a new commit lands on main (no manual deploy needed).
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
